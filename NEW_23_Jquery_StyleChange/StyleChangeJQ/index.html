<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Style Switcher</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <h1>Apply One Style to All Controls</h1>
      <p>Choose a theme by clicking one of the three buttons below.</p>
    </header>

    <div class="toolbar">
      <button id="theme-default">Default Style</button>
      <button id="theme-dark">Dark Style</button>
      <button id="theme-bright">Bright Style</button>
    </div>

    <section class="form-area">
      <div class="field-group">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" />
      </div>

      <div class="field-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="example@domain.com" />
      </div>

      <div class="field-group">
        <label for="category">Category:</label>
        <select id="category">
          <option value="general">General</option>
          <option value="feedback">Feedback</option>
          <option value="support">Support</option>
        </select>
      </div>

      <div class="field-group">
        <label for="message">Message:</label>
        <textarea id="message" rows="5" placeholder="Type your message..."></textarea>
      </div>

      <button id="submit" type="button">Submit</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
