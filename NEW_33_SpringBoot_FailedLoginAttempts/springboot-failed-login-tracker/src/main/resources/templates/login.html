<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .login-container { background: white; padding: 20px 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;}
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-bottom: 10px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        
        <div th:if="${param.error}">
            <div class="error" th:text="${errorMessage != null ? errorMessage : 'Invalid username and password.'}"></div>
        </div>
        <div th:if="${param.logout}">
            <div style="color: green; margin-bottom: 10px;">You have been logged out.</div>
        </div>
        
        <form th:action="@{/login}" method="post">
            <div>
                <input type="text" name="username" placeholder="Username" required autofocus="true"/>
            </div>
            <div>
                <input type="password" name="password" placeholder="Password" required/>
            </div>
            <div>
                <button type="submit">Log in</button>
            </div>
        </form>
    </div>
</body>
</html>
