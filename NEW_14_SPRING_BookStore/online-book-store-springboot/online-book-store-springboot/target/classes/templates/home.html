<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Books | Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Lumina Books</h1>
        <nav>
            <a th:href="@{/login}">Login</a>
            <a th:href="@{/register}">Register</a>
            <a th:href="@{/catalog}">Catalog</a>
        </nav>
    </header>
    <div class="container">
        <div class="glass-card" style="max-width: 600px;">
            <h2 style="font-size: 2.5rem; background: linear-gradient(90deg, #ff8a00, #e52e71); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome to Lumina Books</h2>
            <p style="font-size: 1.2rem; line-height: 1.6; color: #ddd;">Discover your next great read in our beautifully curated digital library. Immerse yourself in a world of knowledge and imagination.</p>
            <br>
            <a th:href="@{/catalog}" style="text-decoration: none;"><button>Explore Catalog</button></a>
        </div>
    </div>
</body>
</html>
