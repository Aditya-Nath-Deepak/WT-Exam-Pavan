<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Books | Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1><a th:href="@{/}" style="color:inherit; text-decoration:none;">Lumina Books</a></h1>
        <nav>
            <a th:href="@{/register}">Register</a>
            <a th:href="@{/catalog}">Catalog</a>
        </nav>
    </header>
    <div class="container">
        <div class="glass-card">
            <h2>Welcome Back</h2>
            <div th:if="${error}" class="error" th:text="${error}"></div>
            <form th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.9rem;">Don't have an account? <a th:href="@{/register}" style="color: #ff8a00;">Register here</a></p>
        </div>
    </div>
</body>
</html>
